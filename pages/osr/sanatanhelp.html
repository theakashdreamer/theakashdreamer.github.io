<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">ABSH - अखिल भारतीय सनातन हेल्पलाइन</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Georgia, "Times New Roman", serif;
    }

    html {
      scroll-behavior: smooth;
    }

    :root {
      --primary: #b45309;
      --primary-dark: #78350f;
      --cream: #fff8ed;
      --soft: #f7ead7;
      --white: #ffffff;
      --text: #2b1607;
      --muted: #6f4e37;
      --border: #e7cfad;
      --shadow: 0 12px 30px rgba(120, 53, 15, 0.12);
    }

    body {
      background: var(--cream);
      color: var(--text);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

    .top-line {
      height: 5px;
      background: linear-gradient(90deg, #78350f, #b45309, #f59e0b);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 248, 237, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      max-width: 1180px;
      margin: auto;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .event-marquee {
      background: var(--primary);
      color: var(--white);
      text-align: center;
      padding: 10px 22px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .event-marquee marquee {
      display: inline-block;
      width: 100%;
      white-space: nowrap;
    }

    .locale-bar {
      max-width: 1180px;
      margin: auto;
      padding: 14px 22px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      background: #fff6eb;
      border-bottom: 1px solid var(--border);
    }

    .locale-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .locale-item label {
      font-weight: 700;
    }

    .locale-item select {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: white;
      color: var(--text);
      min-width: 150px;
      font-size: 14px;
      appearance: none;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary-dark);
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border: 1px solid var(--primary);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--primary);
      font-size: 24px;
      animation: rotateOm 8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes rotateOm {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .logo-text h3 {
      font-size: 20px;
      line-height: 1.1;
    }

    .logo-text span {
      font-size: 13px;
      color: var(--muted);
    }

    nav ul {
      display: flex;
      align-items: center;
      gap: 26px;
      list-style: none;
    }

    nav a {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      position: relative;
      white-space: nowrap;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      background: var(--primary);
      left: 0;
      bottom: -6px;
      transition: 0.3s;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    .nav-btn {
      border: 1px solid var(--primary);
      padding: 10px 16px;
      border-radius: 30px;
      color: var(--primary-dark);
    }

    .nav-btn::after {
      display: none;
    }

    .nav-btn:hover {
      background: var(--primary);
      color: white;
    }

    .menu-btn {
      display: none;
      font-size: 28px;
      color: var(--primary-dark);
      cursor: pointer;
      user-select: none;
    }

    section {
      padding: 90px 22px;
    }

    .container {
      max-width: 1180px;
      margin: auto;
    }

    .hero {
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "ॐ";
      position: absolute;
      right: 7%;
      top: 14%;
      font-size: 250px;
      color: rgba(180, 83, 9, 0.06);
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 50px;
      align-items: center;
      width: 100%;
    }

    .small-title {
      display: inline-block;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 30px;
      background: var(--white);
      margin-bottom: 22px;
      font-size: 14px;
      animation: fadeUp 0.8s ease forwards;
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 72px);
      line-height: 1.05;
      color: var(--primary-dark);
      margin-bottom: 22px;
      animation: fadeUp 1s ease forwards;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      font-size: 18px;
      line-height: 1.8;
      color: var(--muted);
      max-width: 650px;
      margin-bottom: 30px;
      animation: fadeUp 1.2s ease forwards;
    }

    .btn-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      animation: fadeUp 1.4s ease forwards;
    }

    .btn {
      padding: 13px 24px;
      border-radius: 30px;
      font-weight: 700;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: none;
      font-size: 15px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
    }

    .btn-outline {
      border: 1px solid var(--primary);
      color: var(--primary-dark);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-3px);
    }

    .hero-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 24px;
      box-shadow: var(--shadow);
      animation: floatCard 4s ease-in-out infinite;
      width: 100%;
    }

    @keyframes floatCard {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .hero-card-img {
      height: 250px;
      border-radius: 20px;
      background:
        linear-gradient(rgba(120, 53, 15, 0.25), rgba(120, 53, 15, 0.25)),
        url("https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?auto=format&fit=crop&w=900&q=80");
      background-size: cover;
      background-position: center;
      margin-bottom: 22px;
    }

    .hero-card h3 {
      color: var(--primary-dark);
      font-size: 26px;
      margin-bottom: 10px;
    }

    .hero-card p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .helpline-number {
      display: inline-block;
      background: var(--soft);
      border: 1px solid var(--border);
      color: var(--primary-dark);
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 700;
    }

    .section-head {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 45px;
    }

    .section-head span {
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .section-head h2 {
      color: var(--primary-dark);
      font-size: clamp(30px, 4vw, 46px);
      margin: 12px 0 14px;
    }

    .section-head p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .about-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .classic-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 8px 22px rgba(120, 53, 15, 0.08);
      transition: 0.35s;
    }

    .classic-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow);
    }

    .classic-card .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid var(--primary);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 26px;
      margin-bottom: 18px;
      background: var(--cream);
    }

    .classic-card h3 {
      color: var(--primary-dark);
      font-size: 23px;
      margin-bottom: 12px;
    }

    .classic-card p {
      color: var(--muted);
      line-height: 1.7;
    }

    .services {
      background: var(--soft);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .service-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      transition: 0.35s;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(180, 83, 9, 0.08);
      top: -28px;
      right: -28px;
    }

    .service-card:hover {
      background: white;
      transform: translateY(-7px);
      box-shadow: var(--shadow);
    }

    .service-card h3 {
      color: var(--primary-dark);
      font-size: 22px;
      margin: 14px 0 10px;
    }

    .service-card p {
      color: var(--muted);
      line-height: 1.7;
    }

    .service-icon {
      font-size: 32px;
    }

    .banner {
      background: var(--primary-dark);
      color: white;
      border-radius: 28px;
      padding: 55px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .banner::before {
      content: "ॐ";
      position: absolute;
      left: -25px;
      bottom: -75px;
      font-size: 190px;
      color: rgba(255, 255, 255, 0.06);
    }

    .banner h2 {
      font-size: clamp(30px, 5vw, 48px);
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .banner p {
      color: rgba(255,255,255,0.82);
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .banner .helpline-number {
      background: white;
      color: var(--primary-dark);
      position: relative;
      z-index: 1;
      margin-bottom: 22px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .team-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
      text-align: center;
      transition: 0.35s;
    }

    .team-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow);
    }

    .team-avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 1px solid var(--primary);
      color: var(--primary);
      background: var(--cream);
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      font-size: 36px;
    }

    .team-card h3 {
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .team-card p {
      color: var(--muted);
    }

    .contact {
      background: var(--soft);
      border-top: 1px solid var(--border);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 24px;
    }

    .contact-box,
    form {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 8px 22px rgba(120, 53, 15, 0.08);
    }

    .contact-box h3,
    form h3 {
      color: var(--primary-dark);
      font-size: 26px;
      margin-bottom: 18px;
    }

    .contact-item {
      border-bottom: 1px solid var(--border);
      padding: 15px 0;
    }

    .contact-item:last-child {
      border-bottom: none;
    }

    .contact-item strong {
      display: block;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .contact-item span {
      color: var(--muted);
      word-break: break-word;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--cream);
      color: var(--text);
      outline: none;
      font-size: 15px;
      transition: 0.25s;
    }

    textarea {
      min-height: 125px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(180, 83, 9, 0.1);
    }

    .submit-btn {
      width: 100%;
    }

    footer {
      background: var(--primary-dark);
      color: white;
      text-align: center;
      padding: 40px 22px;
    }

    footer h3 {
      color: #fde68a;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .footer-links {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: rgba(255,255,255,0.85);
    }

    .footer-links a:hover {
      color: #fde68a;
    }

    .floating-actions {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 12px;
      z-index: 999;
    }

    .float-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 22px;
      box-shadow: var(--shadow);
      transition: 0.3s;
    }

    .float-btn:hover {
      transform: translateY(-4px);
    }

    .whatsapp {
      background: #22c55e;
    }

    .call {
      background: var(--primary);
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 90px;
      background: #166534;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      transform: translateX(130%);
      transition: 0.35s;
      z-index: 2000;
      box-shadow: var(--shadow);
    }

    .toast.show {
      transform: translateX(0);
    }

    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition: 0.8s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       TABLET RESPONSIVE
    ========================= */

    @media (max-width: 980px) {
      .hero-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: auto;
      }

      .hero-content {
        text-align: center;
      }

      .hero p {
        margin-left: auto;
        margin-right: auto;
      }

      .btn-row {
        justify-content: center;
      }

      .hero-card {
        max-width: 620px;
        margin: auto;
      }

      .about-grid,
      .services-grid,
      .team-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* =========================
       MOBILE RESPONSIVE
    ========================= */

    @media (max-width: 760px) {
      body {
        overflow-x: hidden;
      }

      .navbar {
        padding: 14px 18px;
      }

      .menu-btn {
        display: block;
      }

      nav ul {
        position: absolute;
        left: 0;
        top: 75px;
        width: 100%;
        max-height: calc(100vh - 90px);
        overflow-y: auto;
        padding: 18px;
        background: var(--cream);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
        display: none;
        flex-direction: column;
        gap: 14px;
      }

      nav ul.active {
        display: flex;
      }

      nav li,
      nav a {
        width: 100%;
        text-align: center;
      }

      .nav-btn {
        display: block;
      }

      section {
        padding: 65px 18px;
      }

      .hero {
        padding-top: 75px;
      }

      .hero::before {
        font-size: 150px;
        right: -20px;
        top: 100px;
      }

      .hero-grid {
        gap: 32px;
      }

      .hero h1 {
        font-size: 34px;
        line-height: 1.15;
      }

      .hero p {
        font-size: 15px;
      }

      .small-title {
        font-size: 13px;
      }

      .btn-row {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .about-grid,
      .services-grid,
      .team-grid,
      .form-row,
      .contact-grid {
        grid-template-columns: 1fr !important;
      }

      .hero-card {
        width: 100%;
        animation: none;
        padding: 18px;
      }

      .hero-card-img {
        height: 190px;
      }

      .helpline-number {
        width: 100%;
        text-align: center;
        font-size: 17px;
      }

      .classic-card,
      .service-card,
      .team-card,
      .contact-box,
      form {
        width: 100%;
      }

      .section-head h2 {
        font-size: 27px;
      }

      .section-head p {
        font-size: 15px;
      }

      .banner {
        padding: 35px 20px;
        border-radius: 22px;
      }

      .banner h2 {
        font-size: 28px;
      }

      .banner p {
        font-size: 15px;
      }

      .banner .helpline-number {
        width: 100%;
        font-size: 18px;
      }

      .floating-actions {
        right: 12px;
        bottom: 12px;
      }

      .float-btn {
        width: 48px;
        height: 48px;
      }

      .toast {
        left: 14px;
        right: 14px;
        bottom: 78px;
        text-align: center;
        transform: translateY(140%);
      }

      .toast.show {
        transform: translateY(0);
      }

      .footer-links {
        flex-direction: column;
        gap: 10px;
      }
    }

    /* =========================
       SMALL MOBILE RESPONSIVE
    ========================= */

    @media (max-width: 480px) {
      .navbar {
        padding: 12px 14px;
      }

      .logo-mark {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .logo-text h3 {
        font-size: 15px;
      }

      .logo-text span {
        display: none;
      }

      section {
        padding: 55px 14px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .section-head h2 {
        font-size: 26px;
      }

      .hero-card {
        padding: 14px;
        border-radius: 18px;
      }

      .hero-card-img {
        height: 165px;
        border-radius: 15px;
      }

      .classic-card,
      .service-card,
      .team-card,
      .contact-box,
      form {
        padding: 20px;
        border-radius: 18px;
      }

      .banner {
        padding: 28px 16px;
      }

      input,
      select,
      textarea {
        font-size: 14px;
      }

      .floating-actions {
        right: 10px;
        bottom: 10px;
      }

      .float-btn {
        width: 44px;
        height: 44px;
        font-size: 19px;
      }
    }
  
  
    .white-outline {
      color: white !important;
      border-color: white !important;
    }

    .white-outline:hover {
      background: white !important;
      color: var(--primary-dark) !important;
    }
  </style>
</head>

<body>
  <div class="top-line"></div>

  <header>
    <div class="navbar">
      <a href="#home" class="logo">
        <div class="logo-mark" id="logoMark">ॐ</div>
        <div class="logo-text">
          <h3 id="logoShort">ABSH</h3>
          <span id="logoFull">अखिल भारतीय सनातन हेल्पलाइन</span>
        </div>
      </a>

      <nav>
        <ul id="menu"></ul>
      </nav>

      <div class="menu-btn" id="menuBtn">☰</div>
    </div>
  </header>

  <div class="event-marquee" id="eventMarquee"></div>

  <div class="locale-bar">
    <div class="locale-item">
      <label for="languageSelect" id="languageSelectLabel">भाषा</label>
      <select id="languageSelect"></select>
    </div>
    <div class="locale-item">
      <label for="stateSelect" id="stateSelectLabel">राज्य</label>
      <select id="stateSelect"></select>
    </div>
  </div>

  <main>
    <section class="hero" id="home">
      <div class="container hero-grid">
        <div class="hero-content" id="heroContent"></div>

    function updateDynamicLinks() {
      const phoneHref = "tel:+" + websiteData.contact.phoneRaw;
      const whatsappHref = "https://wa.me/" + websiteData.contact.phoneRaw;

      websiteData.hero.buttons[0].href = phoneHref;
      websiteData.helpline.buttons[0].href = phoneHref;
      websiteData.helpline.buttons[1].href = whatsappHref;
    }

    function sectionHead(data) {
      return `
        <span>${data.subtitle}</span>
        <h2>${data.title}</h2>
        <p>${data.description}</p>
      `;
    }

    function getL10n() {
      const translation = websiteData.translations[websiteData.selectedLanguage];
      if (!translation) {
        return websiteData;
      }

      return {
        ...websiteData,
        ...translation,
        brand: { ...websiteData.brand, ...translation.brand },
        menu: translation.menu || websiteData.menu,
        hero: { ...websiteData.hero, ...translation.hero },
        about: { ...websiteData.about, ...translation.about },
        services: { ...websiteData.services, ...translation.services },
        helpline: { ...websiteData.helpline, ...translation.helpline },
        team: { ...websiteData.team, ...translation.team },
        contactSection: { ...websiteData.contactSection, ...translation.contactSection },
        footer: { ...translation.footer },
        localeLabels: { ...websiteData.localeLabels, ...translation.localeLabels },
        formValidation: { ...websiteData.formValidation, ...translation.formValidation }
      };
    }

    function renderBrand() {
      const current = getL10n();
      document.title = current.brand.title;
      document.getElementById("logoMark").textContent = current.brand.logoMark;
      document.getElementById("logoShort").textContent = current.brand.shortName;
      document.getElementById("logoFull").textContent = current.brand.fullName;
    }

    function renderMenu() {
      const current = getL10n();
      const menu = document.getElementById("menu");
      menu.innerHTML = current.menu.map((item, index) => `
        <li>
          <a href="${item.href}" class="nav-link ${index === 0 ? "active" : ""}">${item.label}</a>
        </li>
      `).join("") + `
        <li><a href="tel:+${websiteData.contact.phoneRaw}" class="nav-btn">${current.helpline.buttons[0].text}</a></li>
      `;
    }

    function renderEventTicker() {
      const current = getL10n();
      const tickerItems = current.newsTicker || websiteData.newsTicker || [];
      const tickerText = tickerItems.map(text => text.trim()).join("  •  ");
      const container = document.getElementById("eventMarquee");

      if (!container || !tickerText) {
        return;
      }

      container.innerHTML = `
        <marquee behavior="scroll" direction="left" scrollamount="6" onmouseover="this.stop();" onmouseout="this.start();">
          ${tickerText}
        </marquee>
      `;
    }

    function renderLocaleControls() {
      const current = getL10n();
      const languageSelect = document.getElementById("languageSelect");
      const stateSelect = document.getElementById("stateSelect");
      const labels = current.localeLabels || websiteData.localeLabels;

      const languageOptions = websiteData.languages.map(lang => `
        <option value="${lang.code}" ${lang.code === websiteData.selectedLanguage ? "selected" : ""}>${lang.label}</option>
      `).join("");

      const stateOptions = [
        `<option value="">${labels.selectState}</option>`,
        ...websiteData.states.map(state => `
          <option value="${state}" ${state === websiteData.selectedState ? "selected" : ""}>${state}</option>
        `)
      ].join("");

      if (languageSelect) {
        languageSelect.innerHTML = languageOptions;
      }

      if (stateSelect) {
        stateSelect.innerHTML = stateOptions;
      }

      const languageLabel = document.getElementById("languageSelectLabel");
      const stateLabel = document.getElementById("stateSelectLabel");

      if (languageLabel) {
        languageLabel.textContent = labels.language;
      }
      if (stateLabel) {
        stateLabel.textContent = labels.state;
      }
    }

    function renderLocalizedContent() {
      updateDynamicLinks();
      renderBrand();
      renderMenu();
      renderEventTicker();
      renderHero();
      renderAbout();
      renderServices();
      renderHelpline();
      renderTeam();
      renderContact();
      renderFooter();
      renderLocaleControls();
      renderFloatingActions();
    }

    function setLanguage(lang) {
      websiteData.selectedLanguage = lang;
      renderLocalizedContent();
    }

    function setState(state) {
      websiteData.selectedState = state || "Bharat";
      websiteData.contact.location = state ? `${state}, India` : "Bharat, India";
      renderContact();
    }

    function renderHero() {
      const current = getL10n();
      const hero = current.hero;

      document.getElementById("heroContent").innerHTML = `
        <span class="small-title">${hero.badge}</span>
        <h1>${hero.titleLine1} <br /><span>${hero.titleLine2}</span></h1>
        <p>${hero.description}</p>
        <div class="btn-row">
          ${hero.buttons.map(btn => `<a href="${btn.href}" class="btn ${btn.className}">${btn.text}</a>`).join("")}
        </div>
      `;

      document.getElementById("heroCard").innerHTML = `
        <div class="hero-card-img" style="background:
          linear-gradient(rgba(120, 53, 15, 0.25), rgba(120, 53, 15, 0.25)),
          url('${hero.card.image}'); background-size: cover; background-position: center;"></div>
        <h3>${hero.card.title}</h3>
        <p>${hero.card.description}</p>
        <div class="helpline-number">${websiteData.contact.phone}</div>
      `;
    }

    function renderAbout() {
      const current = getL10n();
      document.getElementById("aboutHead").innerHTML = sectionHead(current.about);
      document.getElementById("aboutGrid").innerHTML = current.about.cards.map(card => `
        <div class="classic-card reveal">
          <div class="icon">${card.icon}</div>
          <h3>${card.title}</h3>
          <p>${card.description}</p>
        </div>
      `).join("");
    }

    function renderServices() {
      const current = getL10n();
      document.getElementById("servicesHead").innerHTML = sectionHead(current.services);
      document.getElementById("servicesGrid").innerHTML = current.services.items.map(item => `
        <div class="service-card reveal">
          <div class="service-icon">${item.icon}</div>
          <h3>${item.title}</h3>
          <p>${item.description}</p>
        </div>
      `).join("");
    }

    function renderHelpline() {
      const current = getL10n();
      const h = current.helpline;
      document.getElementById("helplineBanner").innerHTML = `
        <h2>${h.title}</h2>
        <p>${h.description}</p>
        <div class="helpline-number">📞 ${websiteData.contact.phone}</div>
        <div class="btn-row" style="justify-content:center; margin-bottom:0;">
          ${h.buttons.map(btn => `<a href="${btn.href}" target="${btn.href.includes('wa.me') ? '_blank' : '_self'}" class="btn ${btn.className}">${btn.text}</a>`).join("")}
        </div>
      `;
    }

    function renderTeam() {
      const current = getL10n();
      document.getElementById("teamHead").innerHTML = sectionHead(current.team);
      document.getElementById("teamGrid").innerHTML = current.team.members.map(member => `
        <div class="team-card reveal">
          <div class="team-avatar">${member.avatar}</div>
          <h3>${member.name}</h3>
          <p>${member.role}</p>
        </div>
      `).join("");
    }

    function renderContact() {
      const current = getL10n();
      document.getElementById("contactHead").innerHTML = sectionHead(current.contactSection);

      document.getElementById("contactDetailsTitle").textContent = current.contactSection.detailsHeading;
      document.getElementById("contactFormTitle").textContent = current.contactSection.formHeading;
      document.getElementById("submitButton").textContent = current.contactSection.submitButtonText;

      document.getElementById("contactDetails").innerHTML = current.contactSection.details.map(item => `
        <div class="contact-item">
          <strong>${item.label}</strong>
          <span>${websiteData.contact[item.valueKey]}</span>
        </div>
      `).join("");

      const rowFields = current.contactSection.formFields.filter(field => field.group === "row");
      const normalFields = current.contactSection.formFields.filter(field => field.group !== "row");

      let formHtml = `
        <div class="form-row">
          ${rowFields.map(renderField).join("")}
        </div>
        ${normalFields.map(renderField).join("")}
      `;

      document.getElementById("dynamicFormFields").innerHTML = formHtml;
    }

    function renderField(field) {
      const required = field.required ? "required" : "";

      if (field.type === "textarea") {
        return `
          <div class="form-group">
            <label>${field.label}</label>
            <textarea id="${field.id}" placeholder="${field.placeholder}" ${required}></textarea>
          </div>
        `;
      }

      if (field.type === "select") {
        return `
          <div class="form-group">
            <label>${field.label}</label>
            <select id="${field.id}" ${required}>
              <option value="">${field.label}</option>
              ${field.options.map(opt => `<option>${opt}</option>`).join("")}
            </select>
          </div>
        `;
      }

      return `
        <div class="form-group">
          <label>${field.label}</label>
          <input type="${field.type}" id="${field.id}" placeholder="${field.placeholder}" ${required} />
        </div>
      `;
    }

    function renderFooter() {
      const current = getL10n();
      document.getElementById("footer").innerHTML = `
        <h3>${current.brand.logoMark} ${current.brand.fullName}</h3>
        <p>${current.brand.tagline}</p>
        <div class="footer-links">
          ${current.menu.filter(item => item.href !== "#team").map(item => `<a href="${item.href}">${item.label}</a>`).join("")}
        </div>
        <p>${current.footer?.copyright || `© 2026 ${current.brand.fullName}. All Rights Reserved.`}</p>
      `;
    }

    function renderFloatingActions() {
      document.getElementById("floatingActions").innerHTML = `
        <a href="https://wa.me/${websiteData.contact.phoneRaw}" target="_blank" class="float-btn whatsapp">☘</a>
        <a href="tel:+${websiteData.contact.phoneRaw}" class="float-btn call">☎</a>
      `;
    }

    function renderSite() {
      updateDynamicLinks();
      websiteData.contact.location = websiteData.selectedState ? `${websiteData.selectedState}, India` : "Bharat, India";
      renderLocalizedContent();
      initEvents();
    }

    function initEvents() {
      const menu = document.getElementById("menu");
      const menuBtn = document.getElementById("menuBtn");
      const languageSelect = document.getElementById("languageSelect");
      const stateSelect = document.getElementById("stateSelect");

      menuBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        menu.classList.toggle("active");
        menuBtn.textContent = menu.classList.contains("active") ? "×" : "☰";
      });

      const menuList = document.getElementById("menu");
      if (menuList) {
        menuList.addEventListener("click", function(e) {
          if (e.target.classList.contains("nav-link")) {
            closeMenu();
          }
        });
      }

      if (languageSelect) {
        languageSelect.addEventListener("change", function(e) {
          setLanguage(e.target.value);
        });
      }

      if (stateSelect) {
        stateSelect.addEventListener("change", function(e) {
          setState(e.target.value);
        });
      }

      document.addEventListener("click", function(e) {
        const header = document.querySelector("header");
        if (!header.contains(e.target)) closeMenu();
      });

      document.getElementById("contactForm").addEventListener("submit", handleFormSubmit);

      window.addEventListener("scroll", function() {
        revealOnScroll();
        activeMenuOnScroll();
      });

      revealOnScroll();
      activeMenuOnScroll();
    }

    function closeMenu() {
      document.getElementById("menu").classList.remove("active");
      document.getElementById("menuBtn").textContent = "☰";
    }

    function revealOnScroll() {
      document.querySelectorAll(".reveal").forEach(function(element) {
        const windowHeight = window.innerHeight;
        const elementTop = element.getBoundingClientRect().top;
        const revealPoint = 110;

        if (elementTop < windowHeight - revealPoint) {
          element.classList.add("active");
        }
      });
    }

    function activeMenuOnScroll() {
      let current = "";
      const sections = document.querySelectorAll("section");
      const navLinks = document.querySelectorAll(".nav-link");

      sections.forEach(function(section) {
        const sectionTop = section.offsetTop - 130;
        const sectionHeight = section.clientHeight;

        if (window.scrollY >= sectionTop && window.scrollY < sectionTop + sectionHeight) {
          current = section.getAttribute("id");
        }
      });

      navLinks.forEach(function(link) {
        link.classList.remove("active");
        if (link.getAttribute("href") === "#" + current) {
          link.classList.add("active");
        }
      });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const current = getL10n();

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const service = document.getElementById("service").value;
      const message = document.getElementById("message").value.trim();

      if (!name || !phone || !service || !message) {
        alert(current.formValidation.required);
        return;
      }

      if (!/^[6-9]\d{9}$/.test(phone)) {
        alert(current.formValidation.invalidPhone);
        return;
      }

      const requestData = {
        name,
        phone,
        service,
        message,
        submittedAt: new Date().toISOString()
      };

      console.log("Form Data:", requestData);

      showToast();
      e.target.reset();
    }

    function showToast() {
      const current = getL10n();
      const toast = document.getElementById("toast");
      toast.textContent = current.formValidation.success;
      toast.classList.add("show");

      setTimeout(function() {
        toast.classList.remove("show");
      }, 3000);
    }

    renderSite();
  </script>
